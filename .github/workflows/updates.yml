name: Check upstream releases
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-updates.py
        env:
          GH_TOKEN: ${{ github.token }}
